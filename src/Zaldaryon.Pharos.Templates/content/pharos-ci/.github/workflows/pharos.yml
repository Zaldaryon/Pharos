name: Pharos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pharos:
    # The inputs are listed in docs/templates.md of Zaldaryon/Pharos.
    uses: Zaldaryon/Pharos/.github/workflows/mod-ci.yml@main
    with:
      test-project: 'TEST_PROJECT_PATH'
      game-version: "GAME_VERSION"
#if (windows)
      os: '["ubuntu-latest", "windows-latest"]'
#else
      os: '["ubuntu-latest"]'
#endif
