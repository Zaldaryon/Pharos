name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VS_VERSION: "1.22.7"

jobs:
  test-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    env:
      VS_CACHE_PATH: ~/.vintagestory-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Mesa and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-utils libgl1-mesa-dri xvfb libopenal1

      - name: Cache Vintage Story
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
          key: vintagestory-linux-${{ env.VS_VERSION }}-v2

      - name: Download Vintage Story
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
          wget -q https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_${{ env.VS_VERSION }}.tar.gz -O /tmp/vs.tar.gz
          tar xzf /tmp/vs.tar.gz -C ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }} --strip-components=1
          rm /tmp/vs.tar.gz

      - name: Build and test with Mesa headless
        env:
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          LIBGL_ALWAYS_INDIRECT: 0
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          ALSOFT_DRIVERS: null
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" dotnet test Pharos.sln -c Release

  test-windows:
    name: Build and Test (Windows)
    runs-on: windows-latest
    env:
      VS_CACHE_PATH: C:\vintagestory-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Vintage Story
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: ${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}
          key: vintagestory-windows-${{ env.VS_VERSION }}-v2

      - name: Download and extract Vintage Story
        if: steps.cache-vs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/crazy-max/innoextract/releases/download/v1.13.0/innoextract-windows-amd64.exe" -OutFile "$env:TEMP\innoextract.exe"
          Invoke-WebRequest -Uri "https://cdn.vintagestory.at/gamefiles/stable/vs_install_win-x64_${{ env.VS_VERSION }}.exe" -OutFile "$env:TEMP\vs_setup.exe"
          $extractStage = "$env:TEMP\vs_extract"
          New-Item -ItemType Directory -Force -Path $extractStage | Out-Null
          & "$env:TEMP\innoextract.exe" --silent --extract --output-dir $extractStage "$env:TEMP\vs_setup.exe"
          $sourceDir = if (Test-Path (Join-Path $extractStage "app\Vintagestory.exe")) { Join-Path $extractStage "app" } else { $extractStage }
          Copy-Item -Path "$sourceDir\*" -Destination "${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}" -Recurse -Force
          Remove-Item -Recurse -Force $extractStage -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:TEMP\vs_setup.exe" -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:TEMP\innoextract.exe" -ErrorAction SilentlyContinue

      - name: Build and test
        env:
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}
        run: dotnet test Pharos.sln -c Release
