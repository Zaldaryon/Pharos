name: CI

# Two lanes. A pull request runs the quick lane: the build and every test that does not boot a
# real client or server (Category!=Live) or measure throughput (Category!=Benchmark), on Linux.
# The full lane runs the whole suite on Linux and Windows and against a dedicated server: on a
# push to main, every night, by hand, for a pull request labeled full-ci, and before a release
# (release.yml calls this workflow).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      soak:
        description: "Run the soak tests, which play game days and take a long time"
        type: boolean
        default: false
  workflow_call:

# A new push to a pull request supersedes the run in progress. Adding a label other than
# full-ci gets a group of its own, so it cannot cancel a real run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VS_VERSION: "1.22.7"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
      filter: ${{ steps.plan.outputs.filter }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the lane
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            [ "$FULL_CI_LABEL" = "true" ] || full=false
            # A label other than full-ci changes nothing to test.
            if [ "$ACTION" = "labeled" ] && [ "$LABEL" != "full-ci" ]; then run=false; fi
            # Documentation alone needs no build.
            if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then run=false; fi
          fi
          filter="Category!=Soak"
          [ "$full" = "true" ] || filter="Category!=Live&Category!=Benchmark&Category!=Soak"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          if [ "$full" = "true" ]; then
            echo "matrix=$(jq -c . scripts/ci-shards.json)" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"shard":1,"filter":""}]}' >> "$GITHUB_OUTPUT"
          fi
          echo "Lane: run=$run full=$full filter='$filter'"

  test-linux:
    name: Build and Test (Linux, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The full lane grew past an hour: 46m on 11/10, 57m38s on main on 12/10, and the
    # full-ci pull requests were killed at the 60 minute mark while still running tests.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Mesa and Xvfb
        run: |
          # A fresh runner may still hold the dpkg lock for its own updates; wait for it, but not forever.
          timeout 600 sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
          timeout 600 sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y mesa-utils libgl1-mesa-dri xvfb libopenal1 libglfw3 libglfw3-dev libcairo2 libcairo2-dev

      # The same action mods use in their own CI, so a change to it is tested here.
      - name: Set up Vintage Story
        id: vs
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}
          mesa: "false"
          xvfb: "false"

      - name: Build
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: dotnet build Pharos.sln -c Release

      - name: Warm cached survival world presets
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: |
          dotnet run --project src/Zaldaryon.Pharos.Cli -c Release --no-build -- fixture --preset survival-flat --game "$VINTAGE_STORY"
          dotnet run --project src/Zaldaryon.Pharos.Cli -c Release --no-build -- fixture --preset survival-standard-small --game "$VINTAGE_STORY"

      - name: Stage assets
        run: ln -sfn ${{ steps.vs.outputs.path }}/assets ./assets

      - name: Test with Mesa headless
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
          LD_LIBRARY_PATH: ${{ steps.vs.outputs.path }}/Lib:${{ steps.vs.outputs.path }}:/usr/lib/x86_64-linux-gnu
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          LIBGL_ALWAYS_INDIRECT: 0
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          ALSOFT_DRIVERS: null
          # Optional: a Vintage Story account session runs the online auth tests; without
          # these secrets (forks, or none configured) those tests are skipped.
          PHAROS_VS_PLAYERNAME: ${{ secrets.PHAROS_VS_PLAYERNAME }}
          PHAROS_VS_PLAYERUID: ${{ secrets.PHAROS_VS_PLAYERUID }}
          PHAROS_VS_SESSIONKEY: ${{ secrets.PHAROS_VS_SESSIONKEY }}
          PHAROS_VS_SESSIONSIGNATURE: ${{ secrets.PHAROS_VS_SESSIONSIGNATURE }}
          PHAROS_ARTIFACTS: ${{ github.workspace }}/artifacts/pharos
          TEST_FILTER: ${{ needs.plan.outputs.filter }}
          SHARD_FILTER: ${{ matrix.filter }}
        run: |
          if [ -n "$SHARD_FILTER" ]; then
            if [ -n "$TEST_FILTER" ]; then
              TEST_FILTER="($TEST_FILTER)&($SHARD_FILTER)"
            else
              TEST_FILTER="$SHARD_FILTER"
            fi
          fi
          if [ -n "$TEST_FILTER" ]; then
            xvfb-run -a -s "-screen 0 1280x720x24" dotnet test Pharos.sln -c Release --no-build --filter "$TEST_FILTER"
          else
            xvfb-run -a -s "-screen 0 1280x720x24" dotnet test Pharos.sln -c Release --no-build
          fi

      - name: Check the pharos tool package
        if: matrix.shard == 1
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: |
          # A version of its own, so the install below can only take this build, never a
          # published package of the same version.
          dotnet pack src/Zaldaryon.Pharos.Cli/Zaldaryon.Pharos.Cli.csproj -c Release -o ./tool-nupkg -p:Version=0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
          scripts/check-tool-package.sh ./tool-nupkg/Zaldaryon.Pharos.Cli.*.nupkg "$VINTAGE_STORY"

      - name: Smoke-test mods with the installed pharos tool
        if: needs.plan.outputs.full == 'true' && matrix.shard == 1
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          ALSOFT_DRIVERS: null
          TEST_MODS: ${{ github.workspace }}/tests/Zaldaryon.Pharos.Tests/TestMods
        run: |
          dotnet tool install Zaldaryon.Pharos.Cli --tool-path "$RUNNER_TEMP/pharos-tool" --add-source ./tool-nupkg \
            --version "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          # From outside the repository, as a mod's own CI would run it.
          cd "$RUNNER_TEMP"
          xvfb-run -a "$RUNNER_TEMP/pharos-tool/pharos" smoke --mod "$TEST_MODS/pharostestmod" --frames 300 \
            --command "/time set day" --strict --preset survival --artifacts "$GITHUB_WORKSPACE/artifacts/pharos/tool-smoke"
          set +e
          # Keep the auth file outside xvfb-run's auto-cleanup directory so cleanup preserves the CLI exit code.
          xvfb-run -a -f "$RUNNER_TEMP/pharosbrokenmod.Xauthority" "$RUNNER_TEMP/pharos-tool/pharos" smoke --mod "$TEST_MODS/pharosbrokenmod" --strict \
            --artifacts "$RUNNER_TEMP/broken-smoke"
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "::error::pharos smoke exited $code for a mod with a missing dependency, not 1"
            exit 1
          fi
          test -n "$(find "$RUNNER_TEMP/broken-smoke" -name boot-diagnostics.txt)"

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-failures-linux-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/pharos
          if-no-files-found: ignore
          retention-days: 14

  remote-server-linux:
    name: Remote Dedicated Server (Linux)
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VS_CACHE_PATH: /home/runner/.vintagestory-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start the dedicated server
        run: |
          docker build --build-arg VS_VERSION=${{ env.VS_VERSION }} -t pharos-vs-server docker/dedicated-server
          docker run -d --name vs -p 42420:42420/tcp -p 42420:42420/udp pharos-vs-server

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Mesa and Xvfb
        run: |
          # A fresh runner may still hold the dpkg lock for its own updates; wait for it, but not forever.
          timeout 600 sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
          timeout 600 sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y mesa-utils libgl1-mesa-dri xvfb libopenal1 libglfw3 libglfw3-dev libcairo2 libcairo2-dev

      - name: Cache Vintage Story
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
          key: vintagestory-linux-${{ env.VS_VERSION }}-v2

      - name: Download Vintage Story
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
          wget -q https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_${{ env.VS_VERSION }}.tar.gz -O /tmp/vs.tar.gz
          tar xzf /tmp/vs.tar.gz -C ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }} --strip-components=1
          rm /tmp/vs.tar.gz

      - name: Build
        env:
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
        run: dotnet build Pharos.sln -c Release

      - name: Stage assets
        run: ln -sf ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}/assets tests/Zaldaryon.Pharos.Tests/bin/Release/net10.0/assets || true

      - name: Wait for the server to accept players
        run: |
          for i in $(seq 1 90); do
            if docker logs vs 2>&1 | grep -q "Dedicated Server now running"; then exit 0; fi
            sleep 2
          done
          docker logs vs
          exit 1

      - name: Test against the dedicated server
        env:
          PHAROS_REMOTE_SERVER: 127.0.0.1:42420
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
          LD_LIBRARY_PATH: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}/Lib:${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}:/usr/lib/x86_64-linux-gnu
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          ALSOFT_DRIVERS: null
          PHAROS_ARTIFACTS: ${{ github.workspace }}/artifacts/pharos
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet test Pharos.sln -c Release --no-build --filter "FullyQualifiedName~RemoteServerTests"

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-failures-remote-server-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/pharos
          if-no-files-found: ignore
          retention-days: 14

      - name: Server log
        if: always()
        run: docker logs vs 2>&1 | tail -200

  soak-linux:
    name: Soak (Linux)
    needs: plan
    if: needs.plan.outputs.run == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak))
    runs-on: ubuntu-latest
    # A soak run plays game days on the virtual clock, and the nightly budget is 120 minutes.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Mesa and Xvfb
        run: |
          timeout 600 sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
          timeout 600 sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y mesa-utils libgl1-mesa-dri xvfb libopenal1 libglfw3 libglfw3-dev libcairo2 libcairo2-dev

      - name: Set up Vintage Story
        id: vs
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}
          mesa: "false"
          xvfb: "false"

      - name: Build
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: dotnet build Pharos.sln -c Release

      - name: Stage assets
        run: ln -sfn ${{ steps.vs.outputs.path }}/assets ./assets

      - name: Soak tests with Mesa headless
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
          LD_LIBRARY_PATH: ${{ steps.vs.outputs.path }}/Lib:${{ steps.vs.outputs.path }}:/usr/lib/x86_64-linux-gnu
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          LIBGL_ALWAYS_INDIRECT: 0
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          ALSOFT_DRIVERS: null
          PHAROS_VS_PLAYERNAME: ${{ secrets.PHAROS_VS_PLAYERNAME }}
          PHAROS_VS_PLAYERUID: ${{ secrets.PHAROS_VS_PLAYERUID }}
          PHAROS_VS_SESSIONKEY: ${{ secrets.PHAROS_VS_SESSIONKEY }}
          PHAROS_VS_SESSIONSIGNATURE: ${{ secrets.PHAROS_VS_SESSIONSIGNATURE }}
          PHAROS_ARTIFACTS: ${{ github.workspace }}/artifacts/pharos
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet test Pharos.sln -c Release --no-build --filter "Category=Soak"

      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-soak-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/pharos
          if-no-files-found: warn

  test-windows:
    name: Build and Test (Windows, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    # Windows downloads the client, builds and runs the whole suite in one job, and it
    # already reached 90m08s on 11/10, which the old budget killed. Runs took 58m to 82m.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VS_CACHE_PATH: C:\vintagestory-cache
      PHAROS_CACHE: C:\pharos-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Vintage Story
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: ${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}
          key: vintagestory-windows-${{ env.VS_VERSION }}-v2

      - name: Cache Pharos world presets
        uses: actions/cache@v4
        with:
          path: ${{ env.PHAROS_CACHE }}
          key: pharos-world-presets-Windows-${{ env.VS_VERSION }}-schema1

      - name: Download and extract Vintage Story
        if: steps.cache-vs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/crazy-max/innoextract/releases/download/v1.13.0/innoextract-windows-amd64.exe" -OutFile "$env:TEMP\innoextract.exe"
          Invoke-WebRequest -Uri "https://cdn.vintagestory.at/gamefiles/stable/vs_install_win-x64_${{ env.VS_VERSION }}.exe" -OutFile "$env:TEMP\vs_setup.exe"
          $extractStage = "$env:TEMP\vs_extract"
          New-Item -ItemType Directory -Force -Path $extractStage | Out-Null
          & "$env:TEMP\innoextract.exe" --silent --extract --output-dir $extractStage "$env:TEMP\vs_setup.exe"
          $sourceDir = if (Test-Path (Join-Path $extractStage "app\Vintagestory.exe")) { Join-Path $extractStage "app" } else { $extractStage }
          Copy-Item -Path "$sourceDir\*" -Destination "${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}" -Recurse -Force
          Remove-Item -Recurse -Force $extractStage -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:TEMP\vs_setup.exe" -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:TEMP\innoextract.exe" -ErrorAction SilentlyContinue

      - name: Build
        env:
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}
        run: dotnet build Pharos.sln -c Release

      - name: Warm cached survival world presets
        env:
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}
        run: |
          dotnet run --project src/Zaldaryon.Pharos.Cli -c Release --no-build -- fixture --preset survival-flat --game "$env:VINTAGE_STORY"
          dotnet run --project src/Zaldaryon.Pharos.Cli -c Release --no-build -- fixture --preset survival-standard-small --game "$env:VINTAGE_STORY"

      - name: Install Mesa Windows
        uses: f3d-app/install-mesa-windows-action@v1
        with:
          path: ${{ github.workspace }}\tests\Zaldaryon.Pharos.Tests\bin\Release\net10.0

      - name: Copy Mesa to Vintage Story Lib
        shell: pwsh
        run: |
          Copy-Item "${{ github.workspace }}\tests\Zaldaryon.Pharos.Tests\bin\Release\net10.0\opengl32.dll" "${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}\Lib\" -Force -ErrorAction SilentlyContinue

      - name: Test
        env:
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}\${{ env.VS_VERSION }}
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          LIBGL_ALWAYS_INDIRECT: 0
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          PHAROS_ARTIFACTS: ${{ github.workspace }}/artifacts/pharos
          # Software rendering on the Windows runner is the slowest lane; the watchdog only
          # catches hangs, so it gets twice the time.
          PHAROS_TIMEOUT_SCALE: "2"
          TEST_FILTER: ${{ needs.plan.outputs.filter }}
          SHARD_FILTER: ${{ matrix.filter }}
        run: |
          $filter = $env:SHARD_FILTER
          if ($env:TEST_FILTER) { $filter = "($env:TEST_FILTER)&($env:SHARD_FILTER)" }
          dotnet test Pharos.sln -c Release --no-build --filter "$filter"

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-failures-windows-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/pharos
          if-no-files-found: ignore
          retention-days: 14

  benchmark-baselines:
    name: Validate Benchmark Baselines
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate baselines file exists
        run: |
          if [ ! -f "pharos-baselines.json" ]; then
            echo "ERROR: pharos-baselines.json not found"
            exit 1
          fi
          echo "✓ pharos-baselines.json exists"

      - name: Validate baselines file structure
        run: |
          # Check JSON is valid
          if ! jq empty pharos-baselines.json 2>/dev/null; then
            echo "ERROR: pharos-baselines.json is not valid JSON"
            exit 1
          fi
          echo "✓ Valid JSON structure"

          # Check required fields
          if ! jq -e '.version' pharos-baselines.json > /dev/null; then
            echo "ERROR: Missing 'version' field"
            exit 1
          fi
          echo "✓ Has 'version' field"

          if ! jq -e '.baselines' pharos-baselines.json > /dev/null; then
            echo "ERROR: Missing 'baselines' field"
            exit 1
          fi
          echo "✓ Has 'baselines' field"

      - name: Validate expected benchmark keys
        run: |
          EXPECTED_KEYS=("IndirectDraw" "SimdCulling" "MeshCompression" "FsrPipeline" "ModCompatibility")
          MISSING_KEYS=()

          for key in "${EXPECTED_KEYS[@]}"; do
            if ! jq -e ".baselines.\"$key\"" pharos-baselines.json > /dev/null; then
              MISSING_KEYS+=("$key")
            fi
          done

          if [ ${#MISSING_KEYS[@]} -gt 0 ]; then
            echo "ERROR: Missing baseline keys: ${MISSING_KEYS[*]}"
            exit 1
          fi

          echo "✓ All expected benchmark keys present"
          echo ""
          echo "Current baselines:"
          jq '.baselines' pharos-baselines.json

      - name: Validate baseline values are positive
        run: |
          # Check all values are positive numbers
          INVALID=$(jq -r '.baselines | to_entries[] | select(.value <= 0) | .key' pharos-baselines.json)

          if [ -n "$INVALID" ]; then
            echo "ERROR: Found non-positive baseline values for: $INVALID"
            exit 1
          fi

          echo "✓ All baseline values are positive"
