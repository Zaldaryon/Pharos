name: CI

# Two lanes. A pull request runs the quick lane: the build and every test that does not boot a
# real client or server (Category!=Live) or measure throughput (Category!=Benchmark), on Linux.
# The full lane runs the whole suite on Linux and Windows and against a dedicated server: on a
# push to main, every night, by hand, for a pull request labeled full-ci, and before a release
# (release.yml calls this workflow).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      soak:
        description: "Run the soak tests, which play game days and take a long time"
        type: boolean
        default: false
  workflow_call:

# A new push to a pull request supersedes the run in progress. Adding a label other than
# full-ci gets a group of its own, so it cannot cancel a real run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VS_VERSION: "1.22.7"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
      filter: ${{ steps.plan.outputs.filter }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the lane
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            [ "$FULL_CI_LABEL" = "true" ] || full=false
            # A label other than full-ci changes nothing to test.
            if [ "$ACTION" = "labeled" ] && [ "$LABEL" != "full-ci" ]; then run=false; fi
            # Documentation alone needs no build.
            if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then run=false; fi
          fi
          filter="Category!=Soak"
          [ "$full" = "true" ] || filter="Category!=Live&Category!=Benchmark&Category!=Soak"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          if [ "$full" = "true" ]; then
            echo "matrix=$(jq -c . scripts/ci-shards.json)" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"shard":1,"total":1}]}' >> "$GITHUB_OUTPUT"
          fi
          echo "Lane: run=$run full=$full filter='$filter'"

  test-linux:
    name: Build and Test (Linux, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Vintage Story
        id: vs
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}
          mesa: "true"
          xvfb: "true"

      - name: Build
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: dotnet build Pharos.sln -c Release

      - name: Build and install Pharos CLI
        run: |
          dotnet pack src/Zaldaryon.Pharos.Cli/Zaldaryon.Pharos.Cli.csproj -c Release -o ./tool-nupkg -p:Version=0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
          dotnet tool install Zaldaryon.Pharos.Cli --tool-path "$RUNNER_TEMP/bin" --add-source ./tool-nupkg --version "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Warm cached survival world presets
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: |
          pharos fixture --preset survival-flat --game "$VINTAGE_STORY"
          pharos fixture --preset survival-standard-small --game "$VINTAGE_STORY"

      - name: Stage assets
        run: ln -sfn ${{ steps.vs.outputs.path }}/assets ./assets

      - name: Test documentation code
        if: matrix.shard == 1
        run: dotnet test tests/Zaldaryon.Pharos.Docs.Tests -c Release --no-build

      - name: Test
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
          PHAROS_VS_PLAYERNAME: ${{ secrets.PHAROS_VS_PLAYERNAME }}
          PHAROS_VS_PLAYERUID: ${{ secrets.PHAROS_VS_PLAYERUID }}
          PHAROS_VS_SESSIONKEY: ${{ secrets.PHAROS_VS_SESSIONKEY }}
          PHAROS_VS_SESSIONSIGNATURE: ${{ secrets.PHAROS_VS_SESSIONSIGNATURE }}
          PHAROS_ARTIFACTS: ${{ github.workspace }}/artifacts/pharos
          TEST_FILTER: ${{ needs.plan.outputs.filter }}
        run: |
          mkdir -p artifacts/pharos
          filter_arg=""
          if [ -n "$TEST_FILTER" ]; then filter_arg="--filter $TEST_FILTER"; fi
          pharos run tests/Zaldaryon.Pharos.Tests --no-build --parallel 3 --shard ${{ matrix.shard }}/${{ matrix.total }} $filter_arg --json artifacts/pharos/run-${{ matrix.shard }}.json --trx artifacts/pharos/shard-${{ matrix.shard }}.trx

      - name: Check the pharos tool package
        if: matrix.shard == 1
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: scripts/check-tool-package.sh ./tool-nupkg/Zaldaryon.Pharos.Cli.*.nupkg "$VINTAGE_STORY"

      - name: Smoke-test mods with the installed pharos tool
        if: needs.plan.outputs.full == 'true' && matrix.shard == 1
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
          TEST_MODS: ${{ github.workspace }}/tests/Zaldaryon.Pharos.Tests/TestMods
        run: |
          cd "$RUNNER_TEMP"
          pharos smoke --mod "$TEST_MODS/pharostestmod" --frames 300 \
            --command "/time set day" --strict \
            --allow '^weatherSim for region -?[0-9]+/-?[0-9]+ is null\. No idea what to do here$' \
            --preset survival --artifacts "$GITHUB_WORKSPACE/artifacts/pharos/tool-smoke"
          set +e
          pharos smoke --mod "$TEST_MODS/pharosbrokenmod" --strict \
            --artifacts "$RUNNER_TEMP/broken-smoke"
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "::error::pharos smoke exited $code for a mod with a missing dependency, not 1"
            exit 1
          fi
          test -n "$(find "$RUNNER_TEMP/broken-smoke" -name boot-diagnostics.txt)"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-results-linux-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/artifacts/pharos/run-${{ matrix.shard }}.json
            ${{ github.workspace }}/artifacts/pharos/shard-${{ matrix.shard }}.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-failures-linux-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/pharos
          if-no-files-found: ignore
          retention-days: 14

  remote-server-linux:
    name: Remote Dedicated Server (Linux)
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start the dedicated server
        run: |
          docker build --build-arg VS_VERSION=${{ env.VS_VERSION }} -t pharos-vs-server docker/dedicated-server
          docker run -d --name vs -p 42420:42420/tcp -p 42420:42420/udp pharos-vs-server

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Vintage Story
        id: vs
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}
          mesa: "true"
          xvfb: "true"

      - name: Build
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: dotnet build Pharos.sln -c Release

      - name: Stage assets
        run: ln -sf ${{ steps.vs.outputs.path }}/assets tests/Zaldaryon.Pharos.Tests/bin/Release/net10.0/assets || true

      - name: Wait for the server to accept players
        run: |
          for i in $(seq 1 90); do
            if docker logs vs 2>&1 | grep -q "Dedicated Server now running"; then exit 0; fi
            sleep 2
          done
          docker logs vs
          exit 1

      - name: Test against the dedicated server
        env:
          PHAROS_REMOTE_SERVER: 127.0.0.1:42420
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
          PHAROS_ARTIFACTS: ${{ github.workspace }}/artifacts/pharos
        run: dotnet test Pharos.sln -c Release --no-build --filter "FullyQualifiedName~RemoteServerTests"

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-failures-remote-server-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/pharos
          if-no-files-found: ignore
          retention-days: 14

      - name: Server log
        if: always()
        run: docker logs vs 2>&1 | tail -200

  soak-linux:
    name: Soak (Linux)
    needs: plan
    if: needs.plan.outputs.run == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak))
    runs-on: ubuntu-latest
    # A soak run plays game days on the virtual clock, and the nightly budget is 120 minutes.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Mesa and Xvfb
        run: |
          timeout 600 sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
          timeout 600 sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y mesa-utils libgl1-mesa-dri xvfb libopenal1 libglfw3 libglfw3-dev libcairo2 libcairo2-dev

      - name: Set up Vintage Story
        id: vs
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}
          mesa: "false"
          xvfb: "false"

      - name: Build
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: dotnet build Pharos.sln -c Release

      - name: Stage assets
        run: ln -sfn ${{ steps.vs.outputs.path }}/assets ./assets

      - name: Soak tests with Mesa headless
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
          LD_LIBRARY_PATH: ${{ steps.vs.outputs.path }}/Lib:${{ steps.vs.outputs.path }}:/usr/lib/x86_64-linux-gnu
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          LIBGL_ALWAYS_INDIRECT: 0
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          ALSOFT_DRIVERS: null
          PHAROS_VS_PLAYERNAME: ${{ secrets.PHAROS_VS_PLAYERNAME }}
          PHAROS_VS_PLAYERUID: ${{ secrets.PHAROS_VS_PLAYERUID }}
          PHAROS_VS_SESSIONKEY: ${{ secrets.PHAROS_VS_SESSIONKEY }}
          PHAROS_VS_SESSIONSIGNATURE: ${{ secrets.PHAROS_VS_SESSIONSIGNATURE }}
          PHAROS_ARTIFACTS: ${{ github.workspace }}/artifacts/pharos
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet test Pharos.sln -c Release --no-build --filter "Category=Soak"

      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-soak-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/pharos
          if-no-files-found: warn

  test-windows:
    name: Build and Test (Windows, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Vintage Story
        id: vs
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}

      - name: Build
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: dotnet build Pharos.sln -c Release

      - name: Build and install Pharos CLI
        shell: bash
        run: |
          dotnet pack src/Zaldaryon.Pharos.Cli/Zaldaryon.Pharos.Cli.csproj -c Release -o ./tool-nupkg -p:Version=0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
          dotnet tool install Zaldaryon.Pharos.Cli --tool-path "$RUNNER_TEMP/bin" --add-source ./tool-nupkg --version "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Warm cached survival world presets
        shell: bash
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: |
          pharos fixture --preset survival-flat --game "$VINTAGE_STORY"
          pharos fixture --preset survival-standard-small --game "$VINTAGE_STORY"

      - name: Test
        shell: bash
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
          PHAROS_ARTIFACTS: ${{ github.workspace }}/artifacts/pharos
          PHAROS_TIMEOUT_SCALE: "2"
          TEST_FILTER: ${{ needs.plan.outputs.filter }}
        run: |
          mkdir -p artifacts/pharos
          filter_arg=""
          if [ -n "$TEST_FILTER" ]; then filter_arg="--filter $TEST_FILTER"; fi
          pharos run tests/Zaldaryon.Pharos.Tests --no-build --parallel 2 --shard ${{ matrix.shard }}/${{ matrix.total }} $filter_arg --json artifacts/pharos/run-${{ matrix.shard }}.json --trx artifacts/pharos/shard-${{ matrix.shard }}.trx

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-results-windows-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/artifacts/pharos/run-${{ matrix.shard }}.json
            ${{ github.workspace }}/artifacts/pharos/shard-${{ matrix.shard }}.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-failures-windows-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/artifacts/pharos
          if-no-files-found: ignore
          retention-days: 14

  benchmark-baselines:
    name: Validate Benchmark Baselines
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate baselines file exists
        run: |
          if [ ! -f "pharos-baselines.json" ]; then
            echo "ERROR: pharos-baselines.json not found"
            exit 1
          fi
          echo "✓ pharos-baselines.json exists"

      - name: Validate baselines file structure
        run: |
          # Check JSON is valid
          if ! jq empty pharos-baselines.json 2>/dev/null; then
            echo "ERROR: pharos-baselines.json is not valid JSON"
            exit 1
          fi
          echo "✓ Valid JSON structure"

          # Check required fields
          if ! jq -e '.version' pharos-baselines.json > /dev/null; then
            echo "ERROR: Missing 'version' field"
            exit 1
          fi
          echo "✓ Has 'version' field"

          if ! jq -e '.baselines' pharos-baselines.json > /dev/null; then
            echo "ERROR: Missing 'baselines' field"
            exit 1
          fi
          echo "✓ Has 'baselines' field"

      - name: Validate expected benchmark keys
        run: |
          EXPECTED_KEYS=("IndirectDraw" "SimdCulling" "MeshCompression" "FsrPipeline" "ModCompatibility")
          MISSING_KEYS=()

          for key in "${EXPECTED_KEYS[@]}"; do
            if ! jq -e ".baselines.\"$key\"" pharos-baselines.json > /dev/null; then
              MISSING_KEYS+=("$key")
            fi
          done

          if [ ${#MISSING_KEYS[@]} -gt 0 ]; then
            echo "ERROR: Missing baseline keys: ${MISSING_KEYS[*]}"
            exit 1
          fi

          echo "✓ All expected benchmark keys present"
          echo ""
          echo "Current baselines:"
          jq '.baselines' pharos-baselines.json

      - name: Validate baseline values are positive
        run: |
          # Check all values are positive numbers
          INVALID=$(jq -r '.baselines | to_entries[] | select(.value <= 0) | .key' pharos-baselines.json)

          if [ -n "$INVALID" ]; then
            echo "ERROR: Found non-positive baseline values for: $INVALID"
            exit 1
          fi

          echo "✓ All baseline values are positive"

  summary:
    name: Summary and Diff
    needs: [plan, test-linux, test-windows]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Linux test results
        uses: actions/download-artifact@v4
        with:
          pattern: pharos-results-linux-*
          path: artifacts/results-linux
          merge-multiple: true

      - name: Download Windows test results
        if: needs.plan.outputs.full == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: pharos-results-windows-*
          path: artifacts/results-windows
          merge-multiple: true

      - name: Set up Vintage Story
        id: vs
        uses: ./.github/actions/setup-vintage-story
        with:
          version: ${{ env.VS_VERSION }}
          mesa: "false"
          xvfb: "false"

      - name: Build and install Pharos CLI
        env:
          VINTAGE_STORY: ${{ steps.vs.outputs.path }}
        run: |
          dotnet pack src/Zaldaryon.Pharos.Cli/Zaldaryon.Pharos.Cli.csproj -c Release -o ./tool-nupkg -p:Version=0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
          dotnet tool install Zaldaryon.Pharos.Cli --tool-path "$RUNNER_TEMP/bin" --add-source ./tool-nupkg --version "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Merge Linux shard results
        run: |
          mkdir -p artifacts/summary
          shards=$(find artifacts/results-linux -name "run-*.json" 2>/dev/null | sort)
          if [ -n "$shards" ]; then
            pharos merge $shards -o artifacts/summary/pharos-run-linux.json --trx artifacts/summary/pharos-linux.trx
          fi

      - name: Merge Windows shard results
        if: needs.plan.outputs.full == 'true'
        run: |
          shards=$(find artifacts/results-windows -name "run-*.json" 2>/dev/null | sort)
          if [ -n "$shards" ]; then
            pharos merge $shards -o artifacts/summary/pharos-run-windows.json --trx artifacts/summary/pharos-windows.trx
          fi

      - name: Run diff comparison
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "artifacts/summary/pharos-run-linux.json" ]; then
            echo "Linux merged test run:"
            jq '{total: .summary.total, passed: .summary.passed, failed: .summary.failed, skipped: .summary.skipped, duration: .summary.duration}' artifacts/summary/pharos-run-linux.json || true
          fi
          mkdir -p artifacts/main-run
          if gh run download --repo Zaldaryon/Pharos --name "pharos-run-merged-*" --dir artifacts/main-run 2>/dev/null; then
            main_manifest=$(find artifacts/main-run -name "pharos-run-linux.json" | head -n 1)
            if [ -n "$main_manifest" ] && [ -f "artifacts/summary/pharos-run-linux.json" ]; then
              echo "Diff against main test run:"
              pharos diff "$main_manifest" artifacts/summary/pharos-run-linux.json || true
            fi
          else
            echo "No previous merged run manifest found on main for comparison."
          fi

      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: pharos-run-merged-${{ github.run_attempt }}
          path: artifacts/summary
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify test status
        run: |
          if [ "${{ needs.test-linux.result }}" != "success" ]; then
            echo "::error::Linux tests failed"
            exit 1
          fi
          if [ "${{ needs.plan.outputs.full }}" = "true" ] && [ "${{ needs.test-windows.result }}" != "success" ]; then
            echo "::error::Windows tests failed"
            exit 1
          fi
