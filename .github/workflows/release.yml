name: Release

# Run by hand from the Actions tab with the version to release, such as 0.5.0. The packages must
# already carry that version. The full CI runs first, on Linux, Windows and a dedicated server;
# only when all of it passes are the packages published to NuGet and the GitHub release created,
# with its tag on the commit that was tested. Nothing is published, and no tag is made, if any
# part fails.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.5.0. Every package must already carry it.
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VS_VERSION: "1.22.7"

jobs:
  prepare:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version, the branch and the tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version such as 0.5.0."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF."
            exit 1
          fi
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::The tag $tag already exists."
            exit 1
          fi
          stale=$(grep -L "<Version>$VERSION</Version>" src/*/Zaldaryon.Pharos*.csproj || true)
          if [ -n "$stale" ]; then
            echo "::error::These packages do not carry version $VERSION: $stale"
            exit 1
          fi
          if ! grep -q "Version = \"$VERSION\"" src/Zaldaryon.Pharos.Bridge/ModInfo.cs; then
            echo "::error::The bridge mod's ModInfo does not carry version $VERSION."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

  ci:
    name: Full CI
    needs: prepare
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish to NuGet and GitHub
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write  # required for NuGet OIDC trusted publishing
      contents: write  # creates the tag and the GitHub release

    env:
      VS_CACHE_PATH: /home/runner/.vintagestory-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Vintage Story
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
          key: vintagestory-linux-${{ env.VS_VERSION }}-v2

      - name: Download Vintage Story
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
          wget -q https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_${{ env.VS_VERSION }}.tar.gz -O /tmp/vs.tar.gz
          tar xzf /tmp/vs.tar.gz -C ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }} --strip-components=1
          rm /tmp/vs.tar.gz

      - name: Build
        env:
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
        run: dotnet build Pharos.sln -c Release

      - name: Pack
        env:
          VINTAGE_STORY: ${{ env.VS_CACHE_PATH }}/${{ env.VS_VERSION }}
        run: |
          dotnet pack src/Zaldaryon.Pharos/Zaldaryon.Pharos.csproj -c Release --no-build -o ./nupkg
          dotnet pack src/Zaldaryon.Pharos.Bridge/Zaldaryon.Pharos.Bridge.csproj -c Release --no-build -o ./nupkg
          dotnet pack src/Zaldaryon.Pharos.XUnit/Zaldaryon.Pharos.XUnit.csproj -c Release --no-build -o ./nupkg
          dotnet pack src/Zaldaryon.Pharos.AtlasCompat/Zaldaryon.Pharos.AtlasCompat.csproj -c Release --no-build -o ./nupkg

      - name: Login to NuGet.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Zaldaryon

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" ./nupkg/*.nupkg ./nupkg/*.snupkg
