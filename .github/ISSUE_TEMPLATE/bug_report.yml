name: Bug Report
description: Report an issue or unexpected behavior in Pharos.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with Pharos. Please fill in the details below to help diagnose and reproduce the problem.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows (x64)
        - Linux (x64)
        - Linux (ARM64)
        - macOS
    validations:
      required: true
  - type: input
    id: vs-version
    attributes:
      label: Vintage Story Version
      placeholder: "1.22.7"
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK Version
      placeholder: "10.0"
    validations:
      required: true
  - type: input
    id: graphics-env
    attributes:
      label: Graphics Environment
      description: Specify GPU and driver or software rasterizer (e.g. Mesa llvmpipe, NVIDIA 550.x, Intel Iris).
      placeholder: "Mesa llvmpipe / GLFW offscreen"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide minimal steps or a sample test method demonstrating the bug.
      placeholder: |
        1. Boot headless client with options...
        2. Advance frames...
        3. Observe exception / unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what should happen under correct operation.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually occurred.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Stack Traces
      description: Paste relevant logs or exception stack traces here.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Verification Checks
      options:
        - label: I verified this issue reproduces on the latest main branch of Pharos.
          required: true
        - label: I searched existing issues to ensure this is not a duplicate.
          required: true
